<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahye Addo - CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header-bar {
            width: 100%;
            max-width: 900px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f8fafc;
        }
        .header-bar h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .download-btn {
            background-color: #0d9488;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0f766e;
        }
        .pdf-container {
            width: 100%;
            max-width: 900px;
            height: calc(100vh - 80px);
            padding: 0 20px 20px 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            background: white;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Yahye Addo — CV</h1>
        <a href="cv.pdf" class="download-btn" download="Yahye_Addo_CV.pdf">Ladda ner CV (PDF)</a>
    </div>

    <div class="pdf-container">
        <iframe src="cv.pdf" title="Yahye Addo CV"></iframe>
    </div>

</body>
</html>
